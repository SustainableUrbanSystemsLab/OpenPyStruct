name: OpenPyStruct
version: 0.1.0
authors:
  - OpenPyStruct Authors
description: >
  Structural optimization for Grasshopper with OpenSees + PyTorch: gradient-based
  moment-of-inertia design of beams and frames, training-data generation, and
  FNN/PINN surrogates. The engine runs in a container (Podman or Docker).
